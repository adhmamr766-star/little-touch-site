<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Touch — Personalized Baby Clothes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@400;500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8f5;--card:#fff;--ink:#4a2a2c;--head:#4d1f22;--mute:#7b6666;--rose:#cd7f80;--rose2:#b96d6d;--bar:#c98e8c;--blush:#f7e1dc;--peach:#ecc3b3;--line:#efdcd5;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark) and (min-width:99999px){:root:not([data-theme="light"]){--bg:#1f1517;--card:#2a1c1f;--ink:#f3e4e1;--head:#fbe9e5;--mute:#c4aaa7;--blush:#33212a;--peach:#3a2528;--line:#4a3235}}
:root[data-theme="off"]{--bg:#1f1517;--card:#2a1c1f;--ink:#f3e4e1;--head:#fbe9e5;--mute:#c4aaa7;--blush:#33212a;--peach:#3a2528;--line:#4a3235}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;color:var(--head);margin:0;line-height:1.15}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding:0 22px}
.bar{background:var(--bar);color:#fff;font-size:13px}
.bar .w{display:flex;justify-content:space-between;gap:12px;padding-top:6px;padding-bottom:6px}
nav{background:var(--bg)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:74px;gap:16px}
.logo{font:400 36px "Great Vibes",cursive;color:var(--head);line-height:1}
.logo small{display:block;font:400 8px Jost;letter-spacing:.3em;color:var(--rose);margin-top:2px}
.links{display:flex;gap:30px;font-size:15px}
.links a{padding:4px 0;border-bottom:2px solid transparent}
.links a.on{color:var(--rose);border-color:var(--rose)}
.ic{display:flex;gap:18px;align-items:center}
.ic svg,.fi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:relative}
.cnt i{position:absolute;top:-8px;right:-9px;background:var(--rose);color:#fff;border-radius:50%;width:16px;height:16px;font:11px/16px Jost;text-align:center}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn{display:inline-flex;gap:8px;align-items:center;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:13px 32px;font:500 16px Jost;cursor:pointer}
.btn:hover{background:var(--rose2)}
.hero{background:linear-gradient(100deg,var(--bg) 0%,var(--blush) 45%,var(--peach) 100%);overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:340px;gap:20px;padding-top:24px}
.eyb{letter-spacing:.3em;font-size:13px;margin-bottom:14px}
.hero h1{font-size:clamp(40px,6vw,64px)}
.hero h1 em{font-family:"Cormorant Garamond",serif}
.hero p{max-width:26em;margin:18px 0 22px}
.hv{display:flex;justify-content:center}
.hv svg{width:100%;max-width:380px;height:auto}
.perks{display:flex;gap:26px;flex-wrap:wrap;margin:26px 0 14px;font-size:13px;line-height:1.3}
.perks div{display:flex;gap:10px;align-items:center}
.perks svg{width:34px;height:34px;fill:none;stroke:var(--rose);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.feat{display:grid;grid-template-columns:.9fr 1.3fr .9fr;gap:30px;align-items:center;padding:34px 0}
.fimg{background:linear-gradient(135deg,var(--peach),var(--blush));border-radius:12px;padding:10px;display:flex;justify-content:center}
.fimg svg{width:100%;max-width:260px}
.tag{color:var(--rose);letter-spacing:.2em;font-size:13px;margin-bottom:6px}
.feat h2{font-size:34px;margin-bottom:10px}
.price{font:500 28px "Cormorant Garamond",serif;color:var(--rose);margin:10px 0 14px}
.fl{background:var(--blush);border-radius:14px;padding:18px 22px}
.fl div{display:flex;gap:14px;align-items:center;padding:9px 0}
.fi{width:50px;height:50px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--rose);flex:none;background:var(--card)}
.fl b{display:block;font-weight:500}.fl span{font-size:13px;color:var(--mute)}
.sec{text-align:center;font-size:26px;margin:14px 0 18px;display:flex;align-items:center;gap:18px}
.sec:before,.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:30px}
.cat{border-radius:10px;height:118px;padding:18px 20px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(120,60,60,.12);color:#4a2a2c}
.cat h3{font-size:20px;color:#4a2a2c;max-width:7em}.cat span{font-size:14px;display:block;margin-top:14px}
.cat svg{position:absolute;right:8px;bottom:6px;width:90px;height:90px;opacity:.85}
.made{background:linear-gradient(90deg,var(--blush),var(--peach));padding:34px 0}
.made .w{display:grid;grid-template-columns:auto 1.4fr 1.2fr;gap:30px;align-items:center}
.circ{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3ee,var(--peach));display:grid;place-items:center;border:6px solid var(--card)}
.circ svg{width:110px}
.made h2{font-size:30px;margin-bottom:10px}
.mi{display:flex;justify-content:space-around;text-align:center;font-size:13px;gap:10px}
.mi svg{width:42px;height:42px;fill:none;stroke:var(--rose);stroke-width:1.4;display:block;margin:0 auto 6px;stroke-linecap:round;stroke-linejoin:round}
footer{text-align:center;color:var(--mute);font-size:13px;padding:22px}
.hv img{width:100%;max-width:430px;border-radius:18px;box-shadow:0 10px 30px rgba(120,60,60,.2);display:block}
.fimg img{width:100%;border-radius:8px;display:block}
.pg{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;padding:30px 0 50px;align-items:start}
.bigimg{width:100%;border-radius:16px;display:block;box-shadow:0 6px 24px rgba(120,60,60,.15)}
.th{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.tb{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:none;aspect-ratio:1}
.tb img{width:100%;height:100%;object-fit:cover;display:block}
.tb[aria-pressed="true"]{border-color:var(--rose)}
.pi{font-family:Tajawal,Jost,sans-serif;line-height:1.9}
.pi h1{font:700 29px/1.5 Tajawal,sans-serif}
.pi ul{list-style:none;padding:0;margin:8px 0}
.pi .meta{background:var(--blush);border-radius:14px;padding:12px 18px;margin:16px 0}
.pi .btn{font-family:Tajawal,sans-serif;font-weight:700}
/* order */
.ord{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;padding:26px 0 48px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
label.l{display:block;margin:14px 0 4px;font-weight:500;font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--rose)}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pay label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.pay input{width:auto}.pay label:has(input:checked){border-color:var(--rose);background:var(--blush)}
.sum{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.sum ul{list-style:none;padding:0;margin:8px 0}.sum li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font:500 26px "Cormorant Garamond",serif;color:var(--head)}
.note{font-size:13px;color:var(--mute)}.err{color:#c0392b;font-size:14px;min-height:22px}
.done{text-align:center;padding:80px 20px}
[hidden]{display:none!important}
@media(max-width:820px){.links{display:none}.hero .w,.feat,.made .w,.ord,.pg{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.bar .w span:nth-child(2){display:none}.circ{margin:auto}.sum{position:static}.pay{grid-template-columns:1fr}}
</style>
</head>

 <a class="logo" href="#/">Little Touch <span style="color:var(--rose);font-size:24px">♡</span><small>PERSONALIZED BABY CLOTHES</small></a>

<script>

const IMG_THUMB = [IMG.main];

function renderHome() {
  document.getElementById('v').innerHTML = `
    <section class="hero"><div class="w">
      <div>
        <div class="eyb">✨ HANDCRAFTED WITH LOVE</div>
        <h1>Pure Comfort for <em>Your Little One</em></h1>
        <p>Discover our delicate collection of 100% organic cotton baby clothes, fully personalized to make every milestone unforgettable.</p>
        <a class="btn" href="#/product">Explore Collection</a>
        <div class="perks">
          <div><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>100% Organic Cotton</span></div>
          <div><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>Safe for Sensitive Skin</span></div>
        </div>
      </div>
      <div class="hv"><img src="${IMG.main}" alt="Baby clothes"></div>
    </div></div></section>
    
    <div class="w">
      <div class="sec"><span>Featured Categories</span></div>
      <div class="cats">
        <div class="cat" style="background:var(--blush)"><h3>Rompers & Onesies</h3><span>Explore</span></div>
        <div class="cat" style="background:var(--peach)"><h3>Gift Sets</h3><span>Explore</span></div>
        <div class="cat" style="background:var(--blush)"><h3>Blankets</h3><span>Explore</span></div>
        <div class="cat" style="background:var(--peach)"><h3>Accessories</h3><span>Explore</span></div>
      </div>
    </div>
  `;
}

function renderProduct() {
  document.getElementById('v').innerHTML = `
    <div class="w"><div class="pg">
      <div>
        <img class="bigimg" id="bi" src="${IMG.main}" alt="Baby Romper">
        <div class="th">
          ${IMG_THUMB.map((t, i) => `<button class="tb" aria-pressed="${i===0}" onclick="document.getElementById('bi').src='${t}'"><img src="${t}"></button>`).join('')}
        </div>
      </div>
      <div class="pi">
        <div class="tag">PERSONALIZED ESSENTIAL</div>
        <h1>Custom Organic Baby Romper</h1>
        <div class="price">AED 125.00</div>
        <p>Crafted from ultra-soft organic cotton. Fully customized with your baby's name in gorgeous embroidery.</p>
        <div class="meta">
          <b>Free Gift Box Included</b>
          <div style="font-size:13px;color:var(--mute)">Every order comes wrapped in our signature eco-friendly gift packaging.</div>
        </div>
        <a class="btn" href="#/order">Customize & Order Now</a>
      </div>
    </div></div>
  `;
}

function renderOrder() {
  document.getElementById('v').innerHTML = `
    <div class="w"><div class="ord">
      <div class="card">
        <h2>Complete Your Order</h2>
        <form id="orderForm">
          <label class="l">Baby / Parent Name</label>
          <input type="text" id="custName" name="name" required placeholder="Enter full name">
          
          <label class="l">Phone Number</label>
          <input type="tel" id="custPhone" name="phone" required placeholder="0501234567">

          <label class="l">Custom Embroidery Text</label>
          <input type="text" id="custText" name="details" required placeholder="Name to stitch on outfit">

          <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:20px;">Send Order to Telegram</button>
        </form>
      </div>
      <div class="sum card">
        <h3>Order Summary</h3>
        <ul>
          <li><span>Custom Organic Baby Romper</span><span>AED 125.00</span></li>
          <li><span>Shipping</span><span>FREE</span></li>
        </ul>
        <div class="tot"><span>Total</span><span>AED 125.00</span></div>
      </div>
    </div></div>
  `;

  // ربط الفورم بالسيرفر الآمن وإرسال البيانات لتلجرام
  document.getElementById('orderForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const details = document.getElementById('custText').value;

    const messageText = `
📌 *طلب جديد من متجر Little Touch!*

👤 *الاسم:* ${name}
📱 *رقم الهاتف:* ${phone}
🛍️ *التفاصيل / التطريز:* ${details}
    `.trim();

    try {
      const response = await fetch(SERVER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: messageText })
      });

      const result = await response.json();

      if (result.success) {
        alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');
        document.getElementById('orderForm').reset();
      } else {
        alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('تعذر الاتصال بالسيرفر الآمن.');
    }
  });
}

function router() {
  const hash = location.hash || '#/';
  if(hash === '#/product') renderProduct();
  else if(hash === '#/order') renderOrder();
  else renderHome();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
</script>
